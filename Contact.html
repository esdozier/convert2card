    <section class="u-clearfix u-section-1" id="block-1">
      <div class="contact-container">
        <form id="contactForm" class="contact-center" novalidate>
          <div class="contact-center-title">
            <h2>Order Request</h2>
            <hr>
          </div>

          <input type="text" id="name" name="name" placeholder="Student Name" required>
          <input type="number" id="cost" name="cost" placeholder="Cost in USD" min="0" step="0.01" required>
          <textarea id="request" name="request" placeholder="Name and/or link to product" required></textarea>

          <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

          <button type="submit">Submit Request</button>
        </form>
      </div>
    </section>

    <footer class="u-align-center u-clearfix u-footer u-grey-80" id="footer">

        <a href="#" class="u-image u-logo u-image-1" data-image-width="277" data-image-height="66">
          <img src="images/mathnasiumlogo.webp" class="u-logo-image u-logo-image-1" alt="Partner logo">
        </a>
        <p class="u-small-text u-text u-text-variant u-text-1">This Is A Test landingpage, not meant for retail use</p>
      </div>
    </footer>

    <script>
      document.getElementById('contactForm').addEventListener('submit', function(e) {
        
        //get function for each input field
        const name = document.getElementById('name').value
        const cost = document.getElementById('cost').value
        const request = document.getElementById('request').value

        const formData = {
          name: name,
          cost: cost,
          request: request,
          convertedCost:(parseFloat(cost) * 2.75).toFixed(2) // Convert cost to cards
        };

        print(formData) // For debugging purposes to check data frame. 

        // Replace with your actual Google Apps Script Deployment URL
        const apiUrl = 'https://script.google.com/macros/s/AKfycbzOlkUr75MlmwqrLZO97mcHZo1XfSI-BEOzkec7PNmnmXs9wIGyShqq6F_oeGpMkinjEg/exec';
        // Send the form data to the Google Sheet via the Google Apps Script
        fetch(apiUrl, {
          method: 'POST',
          mode: 'no-cors',
          cache: "no-cache",
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        })
        .then(() => alert('Your request has been submitted to Mathnasium! Your center director will collect your cards and process your order.'), print('Form submitted successfully.'))
        .catch(error => console.error('Error:', error));
      });
    </script>
